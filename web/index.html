<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ping - Broadcast to local shops in seconds.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ping">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ping - Broadcast to local shops in seconds.</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    #web-loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      background: #F8FAFC;
      color: #0F172A;
      text-align: center;
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      background: #004D40;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(0, 77, 64, 0.18);
      margin-bottom: 24px;
    }
    .brand-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
      color: #0F172A;
      display: flex;
      align-items: baseline;
      justify-content: center;
      margin-bottom: 36px;
    }
    .brand-dot {
      width: 7px;
      height: 7px;
      background-color: #E28743;
      border-radius: 50%;
      margin-left: 4px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid rgba(0, 77, 64, 0.15);
      border-top-color: #004D40;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="web-loading-screen">
    <div class="logo-badge">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>
    <div class="brand-title">
      Ping
      <div class="brand-dot"></div>
    </div>
    <div class="spinner"></div>
  </div>
  <script>
    function hideWebSplashScreen() {
      var loader = document.getElementById('web-loading-screen');
      if (loader && loader.style.opacity !== '0') {
        loader.style.transition = 'opacity 0.3s ease';
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 300);
      }
    }
    window.addEventListener('flutter-first-frame', hideWebSplashScreen);
    var observer = new MutationObserver(function() {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('canvas')) {
        hideWebSplashScreen();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
