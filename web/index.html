<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ping - Broadcast to local shops in seconds.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ping">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ping - Broadcast to local shops in seconds.</title>
  <link rel="manifest" href="manifest.json">

  <style>
    *,
    *::before,
    *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: #F8FAFC;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Splash root ─────────────────────────────────────────────── */
    #web-loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Ping stage — rings + badge live here ────────────────────── */
    .ping-stage {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 36px;
    }

    /* Ripple rings — scale out from badge size, fade to nothing */
    .ring {
      position: absolute;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 77, 64, 0.45);
      animation: pingRing 2.4s cubic-bezier(0.1, 0, 0.6, 1) infinite;
      will-change: transform, opacity;
    }
    .ring:nth-child(1) { animation-delay: 0s; }
    .ring:nth-child(2) { animation-delay: 0.8s; }
    .ring:nth-child(3) { animation-delay: 1.6s; }

    @keyframes pingRing {
      0%   { transform: scale(1);   opacity: 0.85; }
      60%  { opacity: 0.15; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    /* Gold shop-response dots — appear as if nearby shops "reply" */
    .shop-dot {
      position: absolute;
      width: 9px;
      height: 9px;
      background: #E28743;
      border-radius: 50%;
      opacity: 0;
      animation: shopReply 2.4s ease-in-out infinite;
      will-change: transform, opacity;
    }
    /* Positions: different angles & distances from stage center */
    .shop-dot:nth-child(4) { top: 18px;  right: 26px; animation-delay: 0.85s; }
    .shop-dot:nth-child(5) { bottom: 22px; left: 24px; animation-delay: 1.65s; }
    .shop-dot:nth-child(6) { top: 56px;  left: 8px;  animation-delay: 1.25s; }

    @keyframes shopReply {
      0%, 28%  { transform: scale(0);   opacity: 0; }
      48%      { transform: scale(1.25); opacity: 1;
                 box-shadow: 0 0 0 4px rgba(226, 135, 67, 0.18); }
      68%      { transform: scale(1);   opacity: 0.7; }
      100%     { transform: scale(0);   opacity: 0; }
    }

    /* Center badge */
    .logo-badge {
      position: relative;
      z-index: 2;
      width: 76px;
      height: 76px;
      background: linear-gradient(145deg, #004D40 0%, #00695C 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 20px 48px rgba(0, 77, 64, 0.28),
        0 6px 16px rgba(0, 77, 64, 0.18);
    }

    /* ── Wordmark ─────────────────────────────────────────────────── */
    .wordmark {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display",
                   "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -1.8px;
      color: #0F172A;
      line-height: 1;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      margin-bottom: 10px;
    }

    .wordmark-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #E28743;
      margin-bottom: 7px;
      flex-shrink: 0;
    }

    /* ── Tagline ─────────────────────────────────────────────────── */
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text",
                   "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #64748B;
      letter-spacing: 0.1px;
      margin-bottom: 52px;
    }

    /* ── Three-dot loader ────────────────────────────────────────── */
    .loader-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .loader-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #004D40;
      opacity: 0.25;
      animation: loaderDot 1.2s ease-in-out infinite;
      will-change: transform, opacity;
    }
    .loader-dot:nth-child(1) { animation-delay: 0s; }
    .loader-dot:nth-child(2) { animation-delay: 0.2s; }
    .loader-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes loaderDot {
      0%, 80%, 100% { transform: scale(0.65); opacity: 0.25; }
      40%           { transform: scale(1.1);  opacity: 1; }
    }

    /* ── Accessibility: honour reduced-motion preference ─────────── */
    @media (prefers-reduced-motion: reduce) {
      .ring, .shop-dot, .loader-dot { animation: none; }
      .ring { opacity: 0.2; }
      .loader-dot { opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div id="web-loading-screen">

    <!-- Ping stage: radiating rings + badge + gold shop-response dots -->
    <div class="ping-stage">
      <!-- Rings -->
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <!-- Shop-response dots (gold, appear as rings pass through) -->
      <div class="shop-dot"></div>
      <div class="shop-dot"></div>
      <div class="shop-dot"></div>
      <!-- Central badge with bolt icon -->
      <div class="logo-badge">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 2L5 13h7l-1 9 9-11h-7z"/>
        </svg>
      </div>
    </div>

    <!-- Wordmark -->
    <div class="wordmark">
      Ping<div class="wordmark-dot"></div>
    </div>

    <!-- Tagline -->
    <div class="tagline">Broadcast to local shops in seconds.</div>

    <!-- Loading indicator -->
    <div class="loader-dots">
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
    </div>

  </div>

  <script>
    function hideWebSplashScreen() {
      var loader = document.getElementById('web-loading-screen');
      if (loader && loader.style.opacity !== '0') {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', hideWebSplashScreen);
    var observer = new MutationObserver(function() {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('canvas')) {
        hideWebSplashScreen();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
